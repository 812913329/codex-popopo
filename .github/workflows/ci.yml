name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Verify release
        shell: pwsh
        run: .\tools\Verify-Release.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows publish output
        uses: actions/upload-artifact@v4
        with:
          name: CodexProfileLauncher-win-x64
          path: artifacts/publish/win-x64
          if-no-files-found: error
          retention-days: 14

      - name: Upload release archive and metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-archive-and-metadata
          path: |
            artifacts/CodexProfileLauncher-*-win-x64.zip
            artifacts/release-metadata.json
          if-no-files-found: error
          retention-days: 14
